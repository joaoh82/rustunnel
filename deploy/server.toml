# /etc/rustunnel/server.toml
#
# rustunnel-server production configuration.
# Copy this file to /etc/rustunnel/server.toml on the server and adjust
# the values marked with TODO before starting the service.

# ── Server ────────────────────────────────────────────────────────────────────
[server]
# Primary domain — must match your wildcard DNS record:
#   *.edge.rustunnel.com  →  <server public IP>
domain = "edge.rustunnel.com"

# Port 80  — HTTP edge (see plain_http_mode below)
# Port 443 — HTTPS edge (TLS-terminated tunnel ingress)
# Binding to ports < 1024 requires CAP_NET_BIND_SERVICE (granted in the
# systemd unit via AmbientCapabilities=CAP_NET_BIND_SERVICE).
http_port  = 80
https_port = 443

# Plain-HTTP (port 80) behaviour:
#   "proxy"    — requests whose subdomain resolves to a tunnel are proxied
#                directly with X-Forwarded-Proto: http (ngrok parity; required
#                for HMAC-signed webhooks configured with an http:// URL,
#                e.g. Twilio). Everything else 308-redirects to HTTPS.
#   "redirect" — every request 308-redirects to HTTPS (default).
plain_http_mode = "proxy"

# Clients connect here over a TLS WebSocket (wss://).
control_port = 4040

# Dashboard REST API port — internal only, not exposed directly.
# nginx proxies https://edge.rustunnel.com:8443 → http://127.0.0.1:<dashboard_port>
# See deploy/nginx/rustunnel-dashboard for the nginx config.
dashboard_port = 4041

# CORS origin for the external dashboard UI on Vercel.
# Must match the domain where the Next.js app is deployed.
dashboard_origin = "https://dashboard.rustunnel.com"

# ── TLS ───────────────────────────────────────────────────────────────────────
[tls]
# Certificate and private key written by Certbot after running:
#
#   certbot certonly \
#     --dns-cloudflare \
#     --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d "edge.rustunnel.com" \
#     -d "*.edge.rustunnel.com" \
#     --agree-tos --email your@email.com
#
cert_path = "/etc/letsencrypt/live/edge.rustunnel.com/fullchain.pem"
key_path  = "/etc/letsencrypt/live/edge.rustunnel.com/privkey.pem"

# Built-in ACME renewal — leave false when using Certbot (recommended).
# Set to true only if you want rustunnel to manage its own certificates
# via the ACME + Cloudflare DNS-01 challenge workflow.
acme_enabled = false

# Fields below are only used when acme_enabled = true.
acme_email       = ""
acme_staging     = false
acme_account_dir = "/var/lib/rustunnel"

# Cloudflare credentials for ACME DNS-01 (acme_enabled only).
# Prefer passing these via environment variables instead of storing them here:
#   export CLOUDFLARE_API_TOKEN=...
#   export CLOUDFLARE_ZONE_ID=...
cloudflare_api_token = ""
cloudflare_zone_id   = ""

# ── Auth ──────────────────────────────────────────────────────────────────────
[auth]
# Master admin token — used to authenticate clients and to access the
# dashboard API.  Generate a strong secret:
#   openssl rand -hex 32
# TODO: replace with a real secret before starting the service.
admin_token  = ""
require_auth = true
# Failed authentication attempts allowed per source IP per minute before the
# server rejects further attempts outright (control-plane handshake and
# dashboard API). 0 disables the throttle.
max_failed_auth_per_minute = 10

# ── Database ──────────────────────────────────────────────────────────────────
[database]
# PostgreSQL connection URL for shared data (tokens, tunnel history).
# TODO: replace with your actual database host and password.
url = "postgresql://rustunnel:CHANGE_ME@db.example.com:5432/rustunnel"

# Per-region SQLite file for captured HTTP request data.
# Persisted in the rustunnel-data Docker volume across restarts.
captured_path = "/var/lib/rustunnel/captured.db"

# ── Logging ───────────────────────────────────────────────────────────────────
[logging]
# Verbosity: trace | debug | info | warn | error
level  = "info"
# Output format: json (structured, recommended for production) | pretty
format = "json"

# Append-only audit log recording auth attempts, tunnel registrations,
# token create/delete, and admin actions.  Comment out to disable.
audit_log_path = "/var/lib/rustunnel/audit.log"

# Sentry DSN for error tracking and performance monitoring.
# Prefer passing via SENTRY_DSN environment variable.
# Omit or leave empty to disable.
sentry_dsn = ""

# ── Region ────────────────────────────────────────────────────────────────────
# Identity of this server instance within the multi-region fleet.
# The id must match a row in the `regions` table (seeded by migration 0004).
# Omit this section entirely for single-server / self-hosted deployments.
# TODO: set id, name, and location for this server.
[region]
id       = "eu"
name     = "Europe"
location = "Helsinki, FI"

# ── Limits ────────────────────────────────────────────────────────────────────
[limits]
# Maximum tunnels a single authenticated session may hold simultaneously.
max_tunnels_per_session = 10

# Maximum simultaneous proxied connections per tunnel (semaphore-backed).
# Prevents a single misbehaving tunnel from exhausting file descriptors.
max_connections_per_tunnel = 100

# Per-tunnel HTTP request rate limit (requests/second, token-bucket).
rate_limit_rps = 100

# Per-source-IP rate limit across all tunnels (requests/second, sliding window).
# Set to 0 to disable.
ip_rate_limit_rps = 100

# Maximum proxied HTTP request body size in bytes.  Requests exceeding this
# receive a 413 response.  Default is 10 MB.
request_body_max_bytes = 10485760

# Inclusive [low, high] port range reserved for TCP tunnels.
# Each active TCP tunnel consumes one port from this range.
# Make sure these ports are open in your firewall (see README.md).
tcp_port_range = [20000, 20099]

# Inclusive [low, high] port range reserved for UDP tunnels.
# Each active UDP tunnel consumes one port from this range.
# Set to [0, 0] to disable UDP tunnels.
udp_port_range = [20100, 20199]

# ── P2P direct connections ────────────────────────────────────────────────────

[p2p]
# Master switch for P2P tunnels (both relay and direct). When false,
# the server rejects P2P registration and P2pConnect with a clear error.
# Set to true once you're ready to accept P2P traffic in this region.
enabled = true

# Enable P2P direct mode (NAT hole punching). When false, all P2P
# connections use server relay only. Only takes effect when `enabled`
# is also true. Set to true once relay mode is proven stable.
direct_enabled = false

# STUN servers used by clients for NAT type detection.
stun_servers = ["stun.l.google.com:19302", "stun1.l.google.com:19302"]

# Hole punch timeout in milliseconds. If probes don't succeed within
# this window, the connection falls back to relay.
punch_timeout_ms = 5000

# ── Platform API (Hobby-limit analytics) ──────────────────────────────────────
# When both values are set, the edge POSTs Hobby-limit hits to platform-api
# (`POST /internal/hobby-limit`) so it can dedupe and emit payg_nudge_shown.
# An empty internal_token disables the call. Self-hosted servers should
# leave this section out. Environment overrides:
#   RUSTUNNEL_PLATFORM_API_URL
#   RUSTUNNEL_PLATFORM_INTERNAL_TOKEN
[platform]
api_url = "https://api.rustunnel.com"
internal_token = ""
