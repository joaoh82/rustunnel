[package]
name    = "rustunnel-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

# No lib — all code lives in the [[test]] binaries via `mod common`.
[dependencies]
rustunnel-server   = { path = "../crates/rustunnel-server" }
rustunnel-protocol = { path = "../crates/rustunnel-protocol" }

tokio              = { workspace = true }
tokio-tungstenite  = { workspace = true }
tokio-rustls       = { workspace = true }
tokio-util         = { workspace = true }
rustls             = { workspace = true }
futures-util       = { workspace = true }
yamux              = { workspace = true }
arc-swap           = { workspace = true }
rcgen              = { workspace = true }
axum               = { workspace = true }
reqwest            = { workspace = true }
sqlx               = { workspace = true }
uuid               = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile           = { workspace = true }
hmac               = "0.12"
sha1               = "0.10"

[[test]]
name = "auth"
path = "integration/auth.rs"

[[test]]
name = "http_tunnel"
path = "integration/http_tunnel.rs"

[[test]]
name = "tcp_tunnel"
path = "integration/tcp_tunnel.rs"

[[test]]
name = "reconnect"
path = "integration/reconnect.rs"

[[test]]
name = "data_ws_reconnect"
path = "integration/data_ws_reconnect.rs"

[[test]]
name = "udp_tunnel"
path = "integration/udp_tunnel.rs"

[[test]]
name = "p2p_tunnel"
path = "integration/p2p_tunnel.rs"

[[test]]
name = "http_groups"
path = "integration/http_groups.rs"

[[test]]
name = "tcp_groups"
path = "integration/tcp_groups.rs"

[[test]]
name = "health_checks"
path = "integration/health_checks.rs"

[[test]]
name = "version_gate"
path = "integration/version_gate.rs"

[[test]]
name = "alert_webhook"
path = "integration/alert_webhook.rs"

[[test]]
name = "group_events_sse"
path = "integration/group_events_sse.rs"

[[test]]
name = "dashboard_scope"
path = "integration/dashboard_scope.rs"

[[test]]
